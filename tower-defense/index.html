<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Defense</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================ MENU / META ============================ -->
<div id="screen-menu" class="screen">
  <div class="menu-wrap">
    <header class="menu-head">
      <div>
        <h1>Tower&nbsp;Defense</h1>
        <p class="tagline">25 ondas por expedição. O que você desbloqueia fica para sempre.</p>
      </div>
      <div class="xp-box">
        <span class="xp-label">XP disponível</span>
        <strong id="meta-xp">0</strong>
      </div>
    </header>

    <section class="menu-stats" id="meta-stats"></section>

    <section class="menu-block">
      <h2>Mapa</h2>
      <div id="map-list" class="map-list"></div>
    </section>

    <section class="menu-block">
      <h2>Reino</h2>
      <p class="block-hint">Melhorias permanentes. Compradas uma vez, valem em toda expedição.</p>
      <div id="meta-list" class="meta-grid"></div>
    </section>

    <section class="menu-block" id="last-report-block" hidden>
      <h2>Última expedição</h2>
      <p class="block-hint" id="last-report-hint"></p>
      <textarea id="last-report-text" readonly rows="6" aria-label="Relatório da última expedição"></textarea>
      <button id="last-report-copy" class="ghost">Copiar relatório</button>
    </section>

    <div class="menu-actions">
      <button id="btn-start" class="primary big">Iniciar expedição</button>
      <button id="btn-wipe" class="ghost">Apagar progresso</button>
    </div>
  </div>
</div>

<!-- ============================== PARTIDA ============================== -->
<div id="screen-game" class="screen" hidden>
  <div id="app">
    <header id="hud">
      <h1>Tower&nbsp;Defense</h1>
      <div class="stats">
        <div class="stat" title="Ouro"><span class="icon gold"></span><span id="stat-gold">0</span></div>
        <div class="stat" title="Vidas"><span class="icon lives"></span><span id="stat-lives">0</span></div>
        <div class="stat" title="Onda"><span class="icon wave"></span><span id="stat-wave">0</span></div>
        <div class="stat" title="Pontuação"><span class="icon score"></span><span id="stat-score">0</span></div>
      </div>
    </header>

    <main id="stage">
      <div id="board">
        <canvas id="canvas" width="896" height="658"></canvas>

        <!-- Menu de ações da torre: abre com toque longo sobre ela. -->
        <div id="tower-menu" class="tower-menu" hidden>
          <header>
            <strong id="tm-name">Torre</strong>
            <button id="tm-close" class="tm-x" aria-label="Fechar">✕</button>
          </header>
          <div id="tm-split" class="split"></div>
          <dl id="tm-stats"></dl>
          <div id="tm-traco" class="traco" hidden></div>
          <div id="tm-branches" class="branches"></div>
          <div id="tm-fusion" class="fusion"></div>
          <button id="tm-repair" hidden></button>
          <button id="tm-mute"></button>
          <button id="tm-sell" class="danger"></button>
        </div>

        <div id="overlay" class="overlay" hidden>
          <div class="panel">
            <h2 id="overlay-title">Fim</h2>
            <p id="overlay-text"></p>
            <div id="overlay-xp" class="overlay-xp"></div>

            <details id="report-box" class="report">
              <summary>Relatório da partida</summary>
              <div id="report-table" class="report-table"></div>
              <textarea id="report-text" readonly rows="4"
                        aria-label="Relatório em texto"></textarea>
              <button id="report-copy" class="ghost">Copiar relatório</button>
            </details>

            <button id="overlay-btn" class="primary">Voltar ao menu</button>
          </div>
        </div>
      </div>

      <!-- Dock enxuto: só o que não cabe no canvas. -->
      <div id="dock">
        <div id="shop-list" class="shop-row"></div>
        <div class="dock-controls">
          <button id="btn-wave" class="primary">Chamar onda</button>
          <button id="btn-pause">Pausar</button>
          <button id="btn-speed">1x</button>
          <button id="btn-repair-all" title="Conserta as torres feridas, da mais ferida para a menos (F)">Reparar</button>
          <button id="btn-medo" title="Liga/desliga o medo (M)">Medo: on</button>
          <button id="btn-quit" class="ghost">Abandonar</button>
        </div>
        <p id="hint"></p>
      </div>
    </main>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/maps.js"></script>
<script src="js/sprites.js"></script>
<script src="js/mobs.js"></script>
<script src="js/vfx.js"></script>
<script src="js/icones.js"></script>
<script src="js/passos.js"></script>
<script src="js/terrain.js"></script>
<script src="js/trail.js"></script>
<script src="js/perigo.js"></script>
<script src="js/meta.js"></script>
<script src="js/grid.js"></script>
<script src="js/damage.js"></script>
<script src="js/enemy.js"></script>
<script src="js/projectile.js"></script>
<script src="js/tower.js"></script>
<script src="js/waves.js"></script>
<script src="js/spells.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
